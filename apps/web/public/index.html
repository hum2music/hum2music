<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hum2Music</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Hum2Music</h1>
    <p class="note">
      鼻歌から複数トラック（メロディー/ピアノ/ベース/ドラム）の楽曲プレビューを生成します。
      自動編曲は決定的なルールベースの簡易実装です。
    </p>

    <section id="input-section">
      <h2>Input</h2>
      <label>WAVファイルを選択: <input type="file" id="file-input" accept="audio/*" /></label>
      <button id="record-button" type="button">マイク録音開始</button>
      <span id="record-status"></span>
    </section>

    <section id="analysis-section" hidden>
      <h2>Analysis</h2>
      <canvas id="pitch-canvas" width="800" height="200"></canvas>
      <p><strong>BPM候補:</strong> <span id="tempo-candidates"></span></p>
      <p><strong>調性候補:</strong> <span id="key-candidates"></span></p>
      <p id="notes-summary"></p>
    </section>

    <section id="arrangement-section" hidden>
      <h2>Arrangement</h2>

      <fieldset>
        <legend>楽器</legend>
        <label><input type="checkbox" class="instrument-toggle" value="piano" checked /> Piano</label>
        <label><input type="checkbox" class="instrument-toggle" value="bass" checked /> Bass</label>
        <label><input type="checkbox" class="instrument-toggle" value="drums" checked /> Drums</label>
      </fieldset>

      <fieldset>
        <legend>コード進行（編集可）</legend>
        <div id="chord-editor"></div>
      </fieldset>

      <label>
        Humanize: <input type="range" id="humanize-slider" min="0" max="1" step="0.05" value="0" />
        <span id="humanize-value">0</span>
      </label>
      <label>Seed: <input type="number" id="seed-input" value="42" /></label>
      <button id="regenerate-button" type="button">再生成</button>
    </section>

    <section id="export-section" hidden>
      <h2>Export</h2>
      <button id="download-midi-button" type="button">MIDIダウンロード</button>
      <button id="download-wav-button" type="button">WAVダウンロード</button>
      <button id="download-json-button" type="button">JSONダウンロード</button>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
